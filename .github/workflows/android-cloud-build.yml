name: Anti-AFK Assistant Android APK Build

on:
  push:
    branches:
      - cloud-build/anti-afk-assistant
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Anti-AFK Assistant 1.6.5
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK already installed on runner
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Accept SDK licenses and install API 36
        shell: bash
        run: |
          set -euo pipefail
          set +e
          yes | sdkmanager --licenses >/dev/null
          SDKMANAGER_EXIT=${PIPESTATUS[1]}
          set -e
          if [[ "$SDKMANAGER_EXIT" -ne 0 ]]; then
            echo "sdkmanager --licenses failed with exit code $SDKMANAGER_EXIT"
            exit "$SDKMANAGER_EXIT"
          fi
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify build tools
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Rebuild and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat anti-afk-source.part00 anti-afk-source.part01 anti-afk-source.part02 anti-afk-source.part03 anti-afk-source.part04 anti-afk-source.part05 anti-afk-source.part06a anti-afk-source.part06b anti-afk-source.part06c anti-afk-source.part06d anti-afk-source.part06e anti-afk-source.part06f anti-afk-source.part07 > source.tar.gz
          echo "4b37b935257da6e4467a3026bfa70eb1b9b56f034e3a7e11f334f7d7792c6dd0  source.tar.gz" | sha256sum --check
          mkdir source
          tar -xzf source.tar.gz -C source
          test -f source/settings.gradle.kts
          test -f source/app/src/main/java/de/antiafk/assistant/MainActivity.kt

      - name: Export untouched original Android project for inspection
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='.gradle' --exclude='app/build' -czf original-android-source.tar.gz -C source .

      - name: Upload untouched original Android project
        uses: actions/upload-artifact@v4
        with:
          name: original-android-project-source
          path: original-android-source.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Generate floating AFK session menu
        shell: bash
        run: |
          set -euo pipefail
          cp app-build.gradle.kts source/app/build.gradle.kts
          bash .github/scripts/patch-original-project.sh
          test -f source/app/src/main/java/de/antiafk/assistant/MainActivity.kt
          test -f source/app/src/main/java/de/antiafk/assistant/FloatingAssistantService.kt
          test -f source/app/src/main/java/de/antiafk/assistant/ScreenAnalysisService.kt
          test -f source/app/src/main/java/de/antiafk/assistant/ScreenTextClassifier.kt

      - name: Run unit tests
        timeout-minutes: 12
        shell: bash
        run: |
          set -euxo pipefail
          cd source
          gradle --no-daemon --console=plain --stacktrace --warning-mode all clean testDebugUnitTest

      - name: Run Android lint
        timeout-minutes: 12
        shell: bash
        run: |
          set -euxo pipefail
          cd source
          gradle --no-daemon --console=plain --stacktrace lintDebug

      - name: Assemble debug APK
        timeout-minutes: 12
        shell: bash
        run: |
          set -euxo pipefail
          cd source
          gradle --no-daemon --console=plain --stacktrace assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK immediately
        uses: actions/upload-artifact@v4
        with:
          name: anti-afk-assistant-1.6.5-debug-apk
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Assemble release APK
        timeout-minutes: 12
        shell: bash
        run: |
          set -euxo pipefail
          cd source
          gradle --no-daemon --console=plain --stacktrace assembleRelease
          find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: anti-afk-assistant-1.6.5-release-apk
          path: source/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

name: Anti-AFK Assistant Android APK Build

on:
  push:
    branches:
      - cloud-build/anti-afk-assistant
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build original Anti-AFK Assistant APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK already installed on runner
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Accept SDK licenses and install API 36
        shell: bash
        run: |
          set -euo pipefail
          set +e
          yes | sdkmanager --licenses >/dev/null
          SDKMANAGER_EXIT=${PIPESTATUS[1]}
          set -e
          if [[ "$SDKMANAGER_EXIT" -ne 0 ]]; then
            echo "sdkmanager --licenses failed with exit code $SDKMANAGER_EXIT"
            exit "$SDKMANAGER_EXIT"
          fi
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify build tools
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Rebuild and verify original Android source archive
        shell: bash
        run: |
          set -euo pipefail
          cat anti-afk-source.part00 anti-afk-source.part01 anti-afk-source.part02 anti-afk-source.part03 anti-afk-source.part04 anti-afk-source.part05 anti-afk-source.part06a anti-afk-source.part06b anti-afk-source.part06c anti-afk-source.part06d anti-afk-source.part06e anti-afk-source.part06f anti-afk-source.part07 > source.tar.gz
          echo "4b37b935257da6e4467a3026bfa70eb1b9b56f034e3a7e11f334f7d7792c6dd0  source.tar.gz" | sha256sum --check
          mkdir source
          tar -xzf source.tar.gz -C source
          test -f source/settings.gradle.kts
          test -f source/app/src/main/java/de/antiafk/assistant/MainActivity.kt
          test -f source/app/src/main/java/de/antiafk/assistant/SessionCore.kt
          cp app-build.gradle.kts source/app/build.gradle.kts
          echo "MainActivity checksum (must match uploaded source):"
          sha256sum source/app/src/main/java/de/antiafk/assistant/MainActivity.kt

      - name: Apply Kotlin compatibility fixes to original app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("source/app/src/main/java/de/antiafk/assistant")
          main = root / "MainActivity.kt"
          text = main.read_text()

          if "import android.content.Context" not in text:
              anchor = "import android.content.Intent"
              assert anchor in text, "MainActivity import anchor not found"
              text = text.replace(anchor, "import android.content.Context\\n" + anchor, 1)

          old_callback = "    fun changed() { refresh++ }"
          new_callback = "    val changed: () -> Unit = { refresh++ }"
          if old_callback in text:
              text = text.replace(old_callback, new_callback, 1)
          assert new_callback in text, "MainActivity callback declaration not fixed"
          main.write_text(text)

          service = root / "ScreenAnalysisService.kt"
          text = service.read_text()
          projection_line = "val activeProjection = manager.getMediaProjection(resultCode, resultData)"
          if "if (activeProjection == null)" not in text:
              assert projection_line in text, "MediaProjection declaration not found"
              insertion = projection_line + "\\n            if (activeProjection == null) {\\n                stopSelf()\\n                return START_NOT_STICKY\\n            }"
              text = text.replace(projection_line, insertion, 1)
          assert "if (activeProjection == null)" in text, "MediaProjection null handling not fixed"
          service.write_text(text)
          PY

      - name: Run unit tests and build original debug and release APKs
        shell: bash
        run: |
          set -euo pipefail
          cd source
          gradle --no-daemon --stacktrace --warning-mode all clean testDebugUnitTest assembleDebug assembleRelease
          find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload original Anti-AFK Assistant APKs
        uses: actions/upload-artifact@v4
        with:
          name: anti-afk-assistant-original-1.4.4-apks
          path: |
            source/app/build/outputs/apk/debug/*.apk
            source/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

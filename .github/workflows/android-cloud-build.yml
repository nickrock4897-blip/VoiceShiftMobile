name: Android Cloud APK Build

on:
  push:
    branches:
      - cloud-build/anti-afk-assistant
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        name: Checkout source

      - uses: actions/setup-java@v4
        name: Setup Java
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          cat anti-afk-source.part00 anti-afk-source.part01 anti-afk-source.part02 anti-afk-source.part03 anti-afk-source.part04 anti-afk-source.part05 anti-afk-source.part06a anti-afk-source.part06b anti-afk-source.part06c anti-afk-source.part06d anti-afk-source.part06e anti-afk-source.part06f anti-afk-source.part07 > source.tar.gz
          echo "4b37b935257da6e4467a3026bfa70eb1b9b56f034e3a7e11f334f7d7792c6dd0  source.tar.gz" | sha256sum -c
          mkdir source
          tar -xzf source.tar.gz -C source
          cp app-build.gradle.kts source/app/build.gradle.kts

      - name: Apply small Kotlin compile fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("source/app/src/main/java/de/antiafk/assistant")
          p=root/"MainActivity.kt"
          s=p.read_text()
          if "import android.content.Context\\n" not in s:
              s=s.replace("import android.content.Intent\\n","import android.content.Context\\nimport android.content.Intent\\n",1)
          s=s.replace("    fun changed() { refresh++ }\\n","    val changed: () -> Unit = { refresh++ }\\n",1)
          p.write_text(s)
          p=root/"ScreenAnalysisService.kt"
          s=p.read_text()
          s=s.replace("            val activeProjection = manager.getMediaProjection(resultCode, resultData)\\n            projection = activeProjection\\n","            val activeProjection = manager.getMediaProjection(resultCode, resultData)\\n            if (activeProjection == null) { stopSelf(); return START_NOT_STICKY }\\n            projection = activeProjection\\n",1)
          p.write_text(s)
          PY

      - name: Build and test
        run: |
          cd source
          gradle --no-daemon --stacktrace clean testDebugUnitTest assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: anti-afk-assistant-apks
          path: |
            source/app/build/outputs/apk/debug/*.apk
            source/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
